<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Qur'anic Duas</title>

  <!-- Onsen UI -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/onsenui/css/onsenui.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/onsenui/css/onsen-css-components.min.css">

  <!-- Bootstrap (optional; used for spacing) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css">

  <style>
    :root{
      --bg-top: #f0f7ff;
      --bg-mid: #eef6f1;
      --bg-bot: #faf9ff;
      --card-bg: #ffffff;
      --muted: #666;
      --accent: #1f2d3d;
      --highlight: #fff176;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
      color: var(--accent);
    }

    ons-page .content-wrapper {
      padding: 1rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .arabic {
      font-size: 1.15rem;
      direction: rtl;
      text-align: right;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: .5rem;
      line-height: 1.6;
    }

    .list-item__meta {
      font-size: .95rem;
      color: #444;
      margin-bottom: .25rem;
    }

    .no-results {
      padding: 1rem;
      text-align: center;
      color: var(--muted);
    }

    mark {
      background: var(--highlight);
      padding: 0 .12rem;
      border-radius: 2px;
    }

    .search-row {
      display:flex;
      gap:.5rem;
      align-items:center;
    }

    .focus-outline:focus{
      outline: 3px solid rgba(33,150,243,0.4);
      outline-offset: 2px;
    }

    .result-count{
      font-size:.9rem;
      color:var(--muted);
      margin-top:.25rem;
    }

    /* responsive tweaks */
    @media (max-width: 576px) {
      .arabic { font-size: 1.05rem; }
      .search-row { flex-direction:column; align-items:stretch; }
    }
  </style>
</head>
<body>
  <ons-page>
    <ons-toolbar>
      <div class="center">📿 Qur'anic Duas</div>
    </ons-toolbar>

    <div class="content-wrapper">
      <label for="searchInput" class="visually-hidden">Search Duas</label>
      <div class="search-row">
        <input id="searchInput" type="search" placeholder="Search Duas..." aria-label="Search Duas" class="form-control focus-outline">
        <button id="clearBtn" class="btn btn-outline-secondary" aria-label="Clear search">Clear</button>
      </div>
      <div id="resultCount" class="result-count" aria-live="polite"></div>

      <div id="loading" style="padding:.5rem">Loading duas…</div>
      <ons-list id="duaList" aria-live="polite"></ons-list>

      <div id="noResults" class="no-results" hidden>No results found.</div>
    </div>
  </ons-page>

  <!-- Onsen UI JS (kept) -->
  <script src="https://cdn.jsdelivr.net/npm/onsenui/js/onsenui.min.js"></script>

  <script>
  (function () {
    // Debounce helper
    function debounce(fn, wait) {
      let t = null;
      return function(...args) {
        if (t) clearTimeout(t);
        t = setTimeout(() => fn.apply(this, args), wait);
      };
    }

    // Escape HTML to prevent XSS
    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Highlight matched query in escaped text (case-insensitive)
    function highlightEscaped(text, query) {
      if (!query) return escapeHtml(text);
      const escQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); // escape regex chars
      const re = new RegExp('(' + escQuery + ')', 'ig');

      const original = String(text || '');
      let lastIndex = 0;
      let match;
      const parts = [];
      while ((match = re.exec(original)) !== null) {
        const idx = match.index;
        if (idx > lastIndex) {
          parts.push(escapeHtml(original.slice(lastIndex, idx)));
        }
        parts.push('<mark>' + escapeHtml(match[0]) + '</mark>');
        lastIndex = idx + match[0].length;
        if (re.lastIndex === match.index) re.lastIndex++;
      }
      if (lastIndex < original.length) parts.push(escapeHtml(original.slice(lastIndex)));
      if (parts.length === 0) return escapeHtml(original);
      return parts.join('');
    }

    const duaListEl = document.getElementById('duaList');
    const loadingEl = document.getElementById('loading');
    const noResultsEl = document.getElementById('noResults');
    const resultCountEl = document.getElementById('resultCount');

    let duas = [];

    function updateResultCount(count, total) {
      if (count === total) {
        resultCountEl.textContent = total + ' duas';
      } else {
        resultCountEl.textContent = count + ' of ' + total + ' duas shown';
      }
    }

    function loadDuas() {
      fetch('duas.json', { cache: 'no-store' })
        .then(res => {
          if (!res.ok) throw new Error('Network response was not ok: ' + res.status);
          return res.json();
        })
        .then(data => {
          duas = Array.isArray(data) ? data : [];
          renderDuas(duas);
        })
        .catch(err => {
          console.error('Failed to load duas.json:', err);
          loadingEl.textContent = 'Failed to load duas (see console).';
        })
        .finally(() => {
          loadingEl.hidden = true;
        });
    }

    function renderDuas(list, query) {
      query = query || '';
      duaListEl.innerHTML = '';

      if (!list || list.length === 0) {
        noResultsEl.hidden = false;
        updateResultCount(0, duas.length);
        return;
      } else {
        noResultsEl.hidden = true;
      }

      list.forEach(function(dua) {
        const titleHtml = highlightEscaped(dua.title || '', query || '');
        const arabicHtml = highlightEscaped(dua.arabic || '', query || '');
        const translitHtml = highlightEscaped(dua.transliteration || '', query || '');
        const translationHtml = highlightEscaped(dua.translation || '', query || '');

        // Using accessible <details> element for built-in keyboard support
        const li = document.createElement('ons-list-item');
        li.className = 'list-item';
        li.setAttribute('expandable', '');

        const centerDiv = document.createElement('div');
        centerDiv.className = 'center';
        centerDiv.innerHTML = titleHtml;

        const expanded = document.createElement('div');
        expanded.className = 'expandable-content list-item__expanded';
        expanded.innerHTML = `\n          <p class="arabic">${arabicHtml}</p>\n          <p class="list-item__meta"><strong>Transliteration:</strong> ${translitHtml}</p>\n          <p class="list-item__meta"><strong>Translation:</strong> ${translationHtml}</p>\n        `;

        li.appendChild(centerDiv);
        li.appendChild(expanded);

        duaListEl.appendChild(li);
      });

      // Call ons.compile if available so Onsen initializes the new nodes
      if (window.ons && typeof ons.compile === 'function') {
        try { ons.compile(duaListEl); } catch(e) { /* ignore */ }
      }

      updateResultCount(list.length, duas.length);
    }

    function setupSearch() {
      const input = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearBtn');

      function doFilter() {
        const q = input.value.trim().toLowerCase();
        if (!q) {
          renderDuas(duas, '');
          return;
        }
        const filtered = duas.filter(function(d) {
          const title = (d.title || '').toLowerCase();
          const translit = (d.transliteration || '').toLowerCase();
          const translation = (d.translation || '').toLowerCase();
          const arabic = (d.arabic || '').toLowerCase();
          return title.includes(q) || translit.includes(q) || translation.includes(q) || arabic.includes(q);
        });
        renderDuas(filtered, q);
      }

      const debounced = debounce(doFilter, 180);

      input.addEventListener('input', debounced);
      clearBtn.addEventListener('click', function() {
        input.value = '';
        input.focus();
        renderDuas(duas, '');
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadDuas();
      setupSearch();
    });

  })();
  </script>
</body>
</html>
